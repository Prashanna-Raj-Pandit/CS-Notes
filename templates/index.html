{% extends "base.html" %}

{% block content %}
<div class="landing-page">
    <div class="container">
        <div class="section-head">
            <h2>Topics</h2>
            <span class="hint">{{ topics|length }} categories</span>
        </div>

        <div class="topics-grid">
            {% for topic_id, topic in topics.items() %}
            <a href="/topic/{{ topic_id }}" class="topic-card" style="--topic-color: {{ topic.color }}">
                <div class="topic-card-header">
                    <span class="topic-icon">{{ topic.icon }}</span>
                </div>
                <div class="topic-card-body">
                    <h3 class="topic-title">{{ topic.name }}</h3>
                    <p class="topic-count">{{ topic.subtopics|length }} topics</p>
                    <span class="topic-arrow">→</span>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
